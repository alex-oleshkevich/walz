name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run build

  # Builds a plain tarball rather than bundling via tauri-action: walz is
  # distributed as a bare binary (see PKGBUILD), not a .deb/.AppImage, and
  # install.sh expects this exact asset layout.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build release binary
        run: cargo build --release --target ${{ env.TARGET }} --manifest-path src-tauri/Cargo.toml

      - name: Package tarball
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/walz-${TARGET}"
          mkdir -p "$stage"
          install -Dm755 "src-tauri/target/${TARGET}/release/walz" "$stage/walz"
          install -Dm644 "src-tauri/icons/128x128.png" "$stage/walz.png"
          install -Dm644 "walz.desktop" "$stage/walz.desktop"
          install -Dm644 "LICENSE" "$stage/LICENSE" 2>/dev/null || true
          tar -C "$(dirname "$stage")" -czf "walz-${TARGET}.tar.gz" "walz-${TARGET}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: walz-${{ env.TARGET }}.tar.gz
          generate_release_notes: true
